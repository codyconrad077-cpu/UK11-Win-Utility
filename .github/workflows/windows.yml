name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, test and publish unsigned portable executable
        shell: pwsh
        run: |
          $output = @()
          try {
            & ./scripts/build.ps1 -Publish *>&1 | ForEach-Object {
              $output += "$_"
              Write-Host $_
            }
          } catch {
            $output += "$_"
            $detail = ($output | Select-Object -Last 15) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Apex-Tweaks-win-x64-unsigned
          path: artifacts/win-x64/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Apex-Tweaks-win-x64-unsigned
          path: release-files
      - name: Publish single executable on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = @'
          Apex Tweaks — made by riley. Blue-accent Windows control centre preview.

          Download Apex.Tweaks.exe below on Windows 10/11 x64. One self-contained executable; no separate .NET installation or ZIP extraction. Unsigned preview.

          Includes CPU/GPU/RAM usage, compatible CPU/GPU temperature sensors, a simpler name-and-toggle catalogue, section Apply all and global Revert all, Windows restore-point controls, optional app removal, DNS setup/recovery, optional service switches, Windows Update NVIDIA/AMD driver automation, and a defined Microsoft runtime package set through winget.

          General has 45 existing Windows preferences. Advanced contains up to 120 AC/DC controls using Windows-reported High Performance defaults. Availability depends on hardware, Windows and existing values. AC/DC are separate stored targets; this is not a claim of 120 independent FPS improvements. Higher heat, power use and battery drain are possible.

          Driver installation, runtime installation and network operations require internet and applicable Windows components. Installations show package/license details before approval. DDU remains guided/manual. BIOS information/export is read-only: no generic SCEWIN writes, firmware flashing or security bypasses. Temperatures show unavailable when hardware/permissions do not support the sensors.

          Attached reports distinguish portable engine tests, isolated registry/inactive-plan write/restore tests, PowerShell parsing/rejection/read-only checks, and rendered WPF navigation checks. App removal, real service/DNS changes, driver/runtime installations and physical CPU/GPU temperatures still require disposable-client/hardware acceptance. No performance gains are claimed.
          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          gh release create "$env:RELEASE_TAG" release-files/Apex.Tweaks.exe release-files/ui-preview.png release-files/ui-preview-catalogue.png release-files/native-report.json release-files/ui-preview.png.json --repo "$env:RELEASE_REPOSITORY" --verify-tag --prerelease --title "Apex Tweaks $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed' }
