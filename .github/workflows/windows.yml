name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, test and publish unsigned portable executable
        shell: pwsh
        run: |
          $output = @()
          try {
            & ./scripts/build.ps1 -Publish *>&1 | ForEach-Object {
              $output += "$_"
              Write-Host $_
            }
          } catch {
            $output += "$_"
            $detail = ($output | Select-Object -Last 15) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: UK11-Ultimate-win-x64-unsigned
          path: artifacts/win-x64/
