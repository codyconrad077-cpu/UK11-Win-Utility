name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, test and publish unsigned portable executable
        shell: pwsh
        run: |
          $output = @()
          try {
            & ./scripts/build.ps1 -Publish *>&1 | ForEach-Object {
              $output += "$_"
              Write-Host $_
            }
          } catch {
            $output += "$_"
            $detail = ($output | Select-Object -Last 15) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: UK11-Ultimate-win-x64-unsigned
          path: artifacts/win-x64/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UK11-Ultimate-win-x64-unsigned
          path: release-files
      - name: Publish single executable on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = @'
          UK11 ULTIMATE — first development milestone.

          Download UK11.Ultimate.exe below and run it on Windows 10/11 x64. It is self-contained: no separate .NET installation or ZIP extraction is required.

          Includes dashboard, hardware inventory, live memory monitoring, three reversible current-user settings, persistent preferences and verified per-setting backup/restore.

          Windows compilation, 19 core tests and four native registry/hardware checks pass. Interactive UI, real desktop-setting effects and clean-machine execution still require manual acceptance. This executable is unsigned and is an early preview, not a production release. No measured FPS gains are claimed.
          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          gh release create "$env:RELEASE_TAG" release-files/UK11.Ultimate.exe --repo "$env:RELEASE_REPOSITORY" --verify-tag --prerelease --title "UK11 ULTIMATE $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed' }
